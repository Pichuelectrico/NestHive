name: nesthive-map-dev

services:
  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    ports:
      - "8001:8000"
    environment:
      PYTHONUNBUFFERED: "1"
      SIM_SPEED_FACTOR: "4.0"
    volumes:
      - ./backend/app/data/maps:/app/app/data/maps:ro
      - ./backend/app/data/seeds:/app/app/data/seeds:ro
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s

  web:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    command: sh -c "find /app/.next /app/node_modules -mindepth 1 -delete 2>/dev/null; npm install --no-audit --no-fund --include=dev && npm run dev"
    ports:
      - "3001:3000"
    environment:
      NODE_ENV: development
      NEXT_PUBLIC_API_URL: http://localhost:8001
      NEXT_PUBLIC_WS_URL: ws://localhost:8001/ws
    volumes:
      - ./frontend:/app
      - /app/node_modules
      - /app/.next
    depends_on:
      api:
        condition: service_healthy
